services:
  - type: web
    name: sizefix-python-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TEMP_STORAGE_DIR
        value: /tmp/sizefix_temp
